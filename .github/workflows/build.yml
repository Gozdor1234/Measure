name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Measure.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Measure.apk --latest --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from ${GITHUB_SHA::7}"
