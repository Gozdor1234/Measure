name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Publish APK as a new numbered release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Measure.apk
          gh release delete latest --cleanup-tag -y || true  # old single "Latest build" release
          gh release create "$TAG" Measure.apk --latest --target "$GITHUB_SHA" \
            --title "Measure $TAG" --notes "Built from ${GITHUB_SHA::7}"
